<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ server.name }} | Тестовый стенд</title>
    <style>
        :root {
            --primary: #ffaa00;
            --secondary: #ff7700;
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Анимированный фон */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(150px);
            opacity: 0.2;
            z-index: -1;
            animation: move 10s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-50%, -50%); }
            to { transform: translate(50%, 50%); }
        }

        .card {
            background: var(--card-bg);
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 170, 0, 0.3);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 90%;
        }

        h1 { 
            font-size: 3rem;
            margin: 0;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
        }

        .ip-box {
            background: #000;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            margin: 25px 0;
            border: 1px dashed var(--primary);
            transition: 0.3s;
            cursor: pointer;
        }

        .ip-box:hover {
            background: #222;
            transform: scale(1.05);
        }

        .status-bar {
            margin: 20px 0;
            font-size: 0.9rem;
            color: #bbb;
        }

        .online-dot {
            height: 10px;
            width: 10px;
            background-color: #55ff55;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            box-shadow: 0 0 10px #55ff55;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: black;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(255, 170, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 170, 0, 0.5);
        }

        .footer-text {
            margin-top: 30px;
            font-size: 0.8rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="card">
        <h1>{{ server.name }}</h1>
        <div class="status-bar">
            <span class="online-dot"></span> 
            В СЕТИ: {{ server.online }} / {{ server.max }}
        </div>

        <p>Нажми на IP, чтобы скопировать:</p>
        <div class="ip-box" id="serverIP" onclick="copyIP()">
            {{ server.ip }}
        </div>

        <p>Версия: {{ server.version }}</p>

        <a href="#" class="btn">Скачать лаунчер</a>

        <div class="footer-text">Project BurmalCraft &copy; 2024</div>
    </div>

    <script>
        function copyIP() {
            const ipText = document.getElementById('serverIP').innerText;
            navigator.clipboard.writeText(ipText).then(() => {
                const box = document.getElementById('serverIP');
                const originalText = box.innerText;
                box.innerText = "СКОПИРОВАНО!";
                box.style.borderColor = "#55ff55";

                setTimeout(() => {
                    box.innerText = originalText;
                    box.style.borderColor = "#ffaa00";
                }, 1500);
            });
        }
    </script>
</body>
</html>
